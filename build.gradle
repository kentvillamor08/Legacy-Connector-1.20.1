plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// The root project is the runtime/shim mod. The :loader project is the early Forge IModLocator service
// that translates old mod jars before FML discovers the resulting Forge candidates.
evaluationDependsOn(':loader')

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.theillusivec4.top/' } // Curios (Baubles bridge)
    maven { url = 'https://maven.blamejared.com/' } // JEI (NEI bridge)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    maven { url = 'https://maven.createmod.net' } // Create
}

base {
    archivesName = mod_id
}

// The upstream runtime currently uses Java 21 language features. This port keeps that runtime bytecode level
// so we can first migrate the loader APIs without an unrelated source-language downgrade. Forge 1.20.1's
// baseline is Java 17; the finished port will therefore document Java 21 as its tested runtime requirement.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

def shimIndexFile = layout.buildDirectory.file('generated/shimIndex/legacyconnector/shim-index.txt')

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'legacyconnector.shimIndex', shimIndexFile.get().asFile.absolutePath
            property 'legacyconnector.runtimeClasses', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
            if (project.hasProperty('embeddedLibs')) {
                property 'legacyconnector.libsDir', layout.buildDirectory.dir('legacy-libs').get().asFile.absolutePath
            }
            jvmArg '-Xmx6G'
            mods {
                legacyconnector {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'legacyconnector.shimIndex', shimIndexFile.get().asFile.absolutePath
            property 'legacyconnector.runtimeClasses', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
            property 'legacytest.autostop', System.getProperty('legacytest.autostop', 'false')
            if (project.hasProperty('embeddedLibs')) {
                property 'legacyconnector.libsDir', layout.buildDirectory.dir('legacy-libs').get().asFile.absolutePath
            }
            args '--nogui'
            mods {
                legacyconnector {
                    source sourceSets.main
                }
            }
        }
    }
}

// Generate the Mixin refmap using the same source set as the runtime mod.
mixin {
    add sourceSets.main, 'legacyconnector.refmap.json'
    config 'legacyconnector.mixins.json'
    config 'legacyconnector.compat.mixins.json'
}

configurations {
    // Legacy-era libraries embedded in the distributable jar and selectively exposed by the loader.
    legacyLibs { transitive = false }
}

dependencies {
    // Forge 1.20.1 runtime.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The locator service must be present on the launch classpath in development. Production bundles its jar
    // alongside the embedded runtime mod.
    runtimeOnly project(':loader')

    // Mixin support for the runtime mixin configs and refmap.
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional integrations: only linked when the corresponding mod is installed.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) { transitive = false }
    compileOnly(fg.deobf("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}")) { transitive = false }

    // Pehkui provides entity scaling used by the legacy Entity.setSize / eyeHeight bridge.
    jarJar(implementation(fg.deobf("maven.modrinth:pehkui:${pehkui_version}")))

    // Libraries shipped by Forge 1.7.10 / 1.12.2 but absent from the Java 21 runtime.
    // They are plain resources rather than unconditional Jar-in-Jar modules: the loader only offers a library
    // to FML when a legacy mod actually needs it and no other installed mod already provides the package.
    for (lib in [
            'net.sf.trove4j:trove4j:3.0.3',
            'javax.vecmath:vecmath:1.5.2',
            'org.scala-lang:scala-library:2.11.1',
            'org.scala-lang:scala-reflect:2.11.1',
            'org.scala-lang.modules:scala-parser-combinators_2.11:1.0.1',
            'org.scala-lang.modules:scala-xml_2.11:1.0.2',
            'com.typesafe:config:1.2.1',
            'com.typesafe.akka:akka-actor_2.11:2.3.3',
            'com.sun.activation:jakarta.activation:1.2.2'
    ]) {
        legacyLibs(lib)
        if (project.hasProperty('embeddedLibs')) {
            compileOnly lib
        } else {
            implementation lib
        }
    }

    // Java 8 shipped Nashorn; legacy mods and the development script tools still use that API.
    implementation 'org.openjdk.nashorn:nashorn-core:15.4'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The addon API alone (classes + sources), the compile-time dependency of addons.
tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Builds the jar addons compile against (only org.kylepitcock.legacyconnector.api, without api.internal).'
    dependsOn tasks.named('classes')
    archiveBaseName = 'legacyconnector-api'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('dist')
    from(sourceSets.main.output.classesDirs) {
        include 'org/kylepitcock/legacyconnector/api/**'
    }
    from(sourceSets.main.java.srcDirs) {
        include 'org/kylepitcock/legacyconnector/api/**'
        exclude 'org/kylepitcock/legacyconnector/api/internal/**'
    }
}

// ---------------------------------------------------------------------------------------------------------
// Shim index: every legacy API class/member the runtime provides.
// ---------------------------------------------------------------------------------------------------------
def generateShimIndex = tasks.register('generateShimIndex', JavaExec) {
    dependsOn tasks.named('compileJava')
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.shim.ShimIndexGenerator'
    def classDirs = sourceSets.main.output.classesDirs
    inputs.files classDirs
    outputs.file shimIndexFile
    argumentProviders.add({
        [shimIndexFile.get().asFile.absolutePath] + classDirs.files.collect { it.absolutePath }
    } as CommandLineArgumentProvider)
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/shimIndex'))
tasks.named('processResources') { dependsOn generateShimIndex }

// Compile-only legacy API jars that look like the original Forge/Minecraft API to a Java 8 compiler.
['1_7_10', '1_12_2'].each { ver ->
    tasks.register("legacyApiStubs${ver}", JavaExec) {
        dependsOn tasks.named('compileJava')
        classpath = project(':loader').sourceSets.main.runtimeClasspath
        mainClass = 'org.kylepitcock.legacyconnector.loader.shim.LegacyApiStubGenerator'
        def classDir = sourceSets.main.java.classesDirectory
        def out = layout.buildDirectory.file("legacy-api/legacy-api-${ver}.jar")
        inputs.dir classDir
        outputs.file out
        argumentProviders.add({
            [classDir.get().asFile.absolutePath, "legacyconnector/v${ver}/".toString(), out.get().asFile.absolutePath]
        } as CommandLineArgumentProvider)
    }
}

// Offline compatibility check for an installed legacy mod jar.
tasks.register('checkLegacyMod', JavaExec) {
    dependsOn generateShimIndex
    classpath = project(':loader').sourceSets.main.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.tools.CheckJar'
    argumentProviders.add({
        [shimIndexFile.get().asFile.absolutePath] +
                (project.findProperty('legacyJar') ?: '').toString().split(',').findAll { it }
    } as CommandLineArgumentProvider)
}

// Offline report of the texture modernizer.
tasks.register('textureReport', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.core.pack.TextureModernizer'
    argumentProviders.add({
        def client = project.findProperty('modernClient') ?:
                "${System.getenv('APPDATA') ?: System.getProperty('user.home')}/.minecraft/versions/1.20.1/1.20.1.jar"
        def samples = project.findProperty('sampleDir') ?: layout.buildDirectory.dir('texture-samples').get().asFile.absolutePath
        [client.toString(), samples.toString()] +
                (project.findProperty('legacyJar') ?: '').toString().split(',').findAll { it }
    } as CommandLineArgumentProvider)
}

// Offline checks against vanilla registries only (no game, no other mods loaded).
sourceSets {
    devcheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('checkVanillaAspects', JavaExec) {
    dependsOn tasks.named('devcheckClasses'), ':loader:extractMappings'
    classpath = sourceSets.devcheck.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.devcheck.CheckVanillaAspects'
    def fields = project(':loader').layout.buildDirectory.file('generated/mappings/legacyconnector/mappings/1.7.10/fields.csv')
    argumentProviders.add({
        [fields.get().asFile.absolutePath, (project.findProperty('legacyJar') ?: '').toString()]
    } as CommandLineArgumentProvider)
}

// Copies the fixture legacy mods into run/mods for the integration test runs.
tasks.register('installTestMods', Copy) {
    dependsOn ':testmods:assemble'
    from project(':testmods').layout.buildDirectory.dir('libs')
    include 'LegacyTest-*.jar'
    into layout.projectDirectory.dir('run/mods')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Expand Forge metadata from the template.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir(generateModMetadata)
tasks.named('processResources') { dependsOn generateModMetadata }

// Libraries embedded in the distributable jar under META-INF/legacyconnector/libs.
def syncLegacyLibs = tasks.register('syncLegacyLibs', Sync) {
    from configurations.legacyLibs
    into layout.buildDirectory.dir('legacy-libs')
    doLast {
        def names = destinationDir.listFiles().findAll { it.name.endsWith('.jar') }*.name.sort()
        new File(destinationDir, 'index.txt').text = names.join('\n') + '\n'
    }
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn ':loader:jar'
    if (project.hasProperty('embeddedLibs')) dependsOn syncLegacyLibs
}

// The player-facing distribution is one jar: the Forge locator service plus the embedded runtime mod.
tasks.named('jar') {
    archiveClassifier = 'runtime-only'
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.runtime',
                'Implementation-Title': 'Legacy Connector Runtime',
                'Implementation-Version': project.version,
                'MixinConfigs': 'legacyconnector.mixins.json,legacyconnector.compat.mixins.json'
        )
    }
    finalizedBy 'reobfJar'
}

tasks.register('bundleJar', Jar) {
    group = 'build'
    description = 'Builds the single distributable jar (Forge loader service + embedded runtime mod).'
    archiveBaseName = 'legacyconnector'
    archiveVersion = project.version
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('dist')
    def loaderJar = project(':loader').tasks.named('jar')
    def runtimeJar = tasks.named('jar')
    dependsOn loaderJar, runtimeJar, tasks.named('reobfJar'), syncLegacyLibs
    from(layout.buildDirectory.dir('legacy-libs')) {
        into 'META-INF/legacyconnector/libs'
    }
    from({ zipTree(loaderJar.get().archiveFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(runtimeJar) {
        into 'META-INF/legacyconnector'
        rename { 'legacyconnector-runtime.jar' }
    }
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.loader',
                'Implementation-Title': 'Legacy Connector',
                'Implementation-Version': project.version
        )
    }
}
tasks.named('assemble') { dependsOn 'bundleJar' }

// Build and copy the distributable jar to a chosen instance mods directory.
tasks.register('installBundle', Copy) {
    group = 'build'
    description = 'Builds the bundled jar and copies it into the mods folder given by -PmodsDir=/path/to/mods.'
    dependsOn 'bundleJar'
    from(tasks.named('bundleJar'))
    doFirst {
        def dir = findProperty('modsDir')
        if (!dir) throw new GradleException('Pass the target mods folder: -PmodsDir=/path/to/instance/mods')
        fileTree(dir: dir, include: 'legacyconnector-*.jar').each { it.delete() }
        destinationDir = file(dir)
    }
    destinationDir = layout.buildDirectory.dir('installBundle-unset').get().asFile
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Widen the compiled shim classes so legacy bytecode can access them just as it did the original FML APIs.
tasks.named('compileJava', JavaCompile) {
    dependsOn ':loader:classes'
    options.encoding = 'UTF-8'
    options.incremental = false
    def loaderClasspath = project(':loader').sourceSets.main.runtimeClasspath
    doLast {
        project.javaexec {
            executable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
                    .get().executablePath.asFile.absolutePath
            classpath = loaderClasspath
            mainClass = 'org.kylepitcock.legacyconnector.loader.shim.ShimAccessWidener'
            args destinationDirectory.get().asFile.absolutePath
        }
    }
}
