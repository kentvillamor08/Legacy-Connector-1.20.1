pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // ForgeGradle 6 plugin repository.
        maven { url = 'https://maven.minecraftforge.net' }
        // Sponge MixinGradle plugin repository.
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'legacyconnector'

// Service-layer half: discovers legacy jars, translates them, and exposes Forge mod candidates.
include 'loader'
// Java 8 fixture mods used to verify legacy translation and registration.
include 'testmods'
