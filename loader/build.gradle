plugins {
    id 'java-library'
}

// The loader runs on FML's SERVICE module layer, before Minecraft classes exist.
// It may only depend on FML / modlauncher / ASM / Gson / SLF4J, all of which NeoForge ships.
group = mod_group_id
version = mod_version
base.archivesName = 'legacyconnector-loader'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    forge1710
    mcp1710
    mcp1122
}

dependencies {
    compileOnly("net.neoforged.fancymodloader:loader:4.0.45") { transitive = false }
    compileOnly("cpw.mods:securejarhandler:3.0.8") { transitive = false }
    compileOnly("cpw.mods:modlauncher:11.0.5") { transitive = false }
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    compileOnly "com.google.code.gson:gson:2.10.1"
    compileOnly "org.jetbrains:annotations:24.1.0"
    api "org.ow2.asm:asm:${asm_version}"
    api "org.ow2.asm:asm-commons:${asm_version}"
    api "org.ow2.asm:asm-tree:${asm_version}"

    // 1.7.10: the names Forge itself shipped (setBlockName, registerBlockIcons, ...) are what mod authors
    // actually wrote against; MCP stable_12 fills ids Forge's table lacks.
    forge1710 "net.minecraftforge:forge:${forge_1_7_10}:userdev@jar"
    mcp1710 "de.oceanlabs.mcp:mcp_stable:${mcp_1_7_10}@zip"
    mcp1122 "de.oceanlabs.mcp:mcp_stable:${mcp_1_12_2}@zip"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

repositories {
    maven {
        url = 'https://maven.minecraftforge.net'
        metadataSources { mavenPom(); artifact() } // ancient Forge artifacts have no POM
        content {
            includeGroup 'de.oceanlabs.mcp'
            includeModule 'net.minecraftforge', 'forge'
        }
    }
}

// SRG -> MCP name tables. Legacy mod jars are reobfuscated to SRG names (func_1234_a / field_1234_a);
// the shim API is written with readable MCP names, so the transformer renames members on the fly.
def extractMappings = tasks.register('extractMappings', Sync) {
    into layout.buildDirectory.dir('generated/mappings')
    [('1.7.10'): configurations.mcp1710, ('1.12.2'): configurations.mcp1122].each { ver, conf ->
        from({ zipTree(conf.singleFile) }) {
            include 'methods.csv', 'fields.csv'
            into "legacyconnector/mappings/${ver}"
            // For 1.7.10 the MCP export is only the fallback table.
            if (ver == '1.7.10') rename { "fallback-${it}" }
        }
    }
    from({ zipTree(configurations.forge1710.singleFile) }) {
        include 'conf/methods.csv', 'conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.7.10/${it.name}" }
        includeEmptyDirs = false
    }
}
sourceSets.main.resources.srcDir extractMappings

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.loader',
                'Implementation-Version': project.version
        )
    }
}

// Content hash of the compiled translator, embedded as a resource. Part of every translation cache key, so changing
// the loader re-translates legacy jars without manual version bumps.
def buildIdDir = layout.buildDirectory.dir('generated/buildId')
def generateBuildId = tasks.register('generateBuildId') {
    def classesDir = sourceSets.main.java.classesDirectory
    def hierarchy = fileTree('src/main/resources/legacyconnector/legacy')
    def mappings = fileTree(layout.buildDirectory.dir('generated/mappings'))
    dependsOn 'extractMappings'
    inputs.files(classesDir, hierarchy, mappings)
    outputs.dir buildIdDir
    doLast {
        def md = java.security.MessageDigest.getInstance('SHA-256')
        (classesDir.get().asFileTree.files + hierarchy.files + mappings.files).sort { it.absolutePath }.each { md.update(it.bytes) }
        def out = buildIdDir.get().file('legacyconnector/loader-build-id.txt').asFile
        out.parentFile.mkdirs()
        out.text = md.digest().encodeHex().toString()
    }
}
sourceSets.main.resources.srcDir(files(buildIdDir).builtBy(generateBuildId))

// Legacy-named LaunchWrapper / FML relauncher API that 1.7.10 coremod plugins and class transformers link against.
// Packed as a nested jar: it is only ever loaded in the isolated class loader that runs legacy coremods.
sourceSets {
    coremodApi
}
dependencies {
    coremodApiCompileOnly "org.ow2.asm:asm-commons:${asm_version}"
    coremodApiCompileOnly "org.apache.logging.log4j:log4j-api:2.22.1"
}
def coremodApiJar = tasks.register('coremodApiJar', Jar) {
    from sourceSets.coremodApi.output
    archiveFileName = 'coremod-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/coremodApi/legacyconnector/legacy/1.7.10')
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/coremodApi')).builtBy(coremodApiJar))


// Offline inspection aid for the first Forge 1.20.1 content-mod pilot.
// Example: ./gradlew :loader:inspectForge1201 -Pforge1201Jar=/path/to/mod.jar
tasks.register('inspectForge1201', JavaExec) {
    group = 'verification'
    description = 'Inventories Minecraft/Forge API references in a Forge 1.20.1 mod jar without loading it.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201ApiUsageAnalyzer'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        setArgs([jarPath.toString()])
    }
}

 
// Produces a separate metadata-only NeoForge JAR for inspection.
// This does not remap classes and must not be added to the mod discovery pipeline.
tasks.register('transformForge1201Metadata', JavaExec) {
    group = 'verification'
    description = 'Creates a metadata-only NeoForge copy of a Forge 1.20.1 JAR without modifying the source.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201JarArchiveTransformer'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        def outputPath = project.findProperty('forge1201Output')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        if (outputPath == null || outputPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Output=<path-to-new-metadata-only-jar>')
        }

        def loaderRange = project.findProperty('forge1201LoaderRange') ?: project.property('loader_version_range')
        def neoRange = project.findProperty('forge1201NeoForgeRange') ?: "[${project.property('neo_version')},)"
        def minecraftRange = project.findProperty('forge1201MinecraftRange') ?: project.property('minecraft_version_range')
        setArgs([
                jarPath.toString(),
                outputPath.toString(),
                loaderRange.toString(),
                neoRange.toString(),
                minecraftRange.toString()
        ])
    }
}
