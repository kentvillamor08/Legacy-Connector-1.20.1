plugins {
    id 'java-library'
}

// The loader runs on FML's SERVICE module layer, before Minecraft classes exist.
// It may only depend on FML / modlauncher / ASM / Gson / SLF4J, all of which NeoForge ships.
group = mod_group_id
version = mod_version
base.archivesName = 'legacyconnector-loader'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    forge1710
    mcp1710
    mcp1122
    // Verification-only source mappings. These configurations are never part of the loader/runtime artifact.
    forge1201McpConfig
    forge1201Installertools
}

dependencies {
    compileOnly("net.neoforged.fancymodloader:loader:4.0.45") { transitive = false }
    compileOnly("cpw.mods:securejarhandler:3.0.8") { transitive = false }
    compileOnly("cpw.mods:modlauncher:11.0.5") { transitive = false }
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    compileOnly "com.google.code.gson:gson:2.10.1"
    compileOnly "org.jetbrains:annotations:24.1.0"
    api "org.ow2.asm:asm:${asm_version}"
    api "org.ow2.asm:asm-commons:${asm_version}"
    api "org.ow2.asm:asm-tree:${asm_version}"

    // 1.7.10: the names Forge itself shipped (setBlockName, registerBlockIcons, ...) are what mod authors
    // actually wrote against; MCP stable_12 fills ids Forge's table lacks.
    forge1710 "net.minecraftforge:forge:${forge_1_7_10}:userdev@jar"
    mcp1710 "de.oceanlabs.mcp:mcp_stable:${mcp_1_7_10}@zip"
    mcp1122 "de.oceanlabs.mcp:mcp_stable:${mcp_1_12_2}@zip"
    // Source-version inputs for the read-only member audit. The MCPConfig archive contains joined.tsrg;
    // Installertools combines it with Mojang's official client/server mappings to generate methods.csv/fields.csv.
    forge1201McpConfig "de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip"
    forge1201Installertools "net.minecraftforge:installertools:1.4.3:fatjar"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

repositories {
    maven {
        url = 'https://maven.minecraftforge.net'
        metadataSources { mavenPom(); artifact() } // ancient Forge artifacts have no POM
        content {
            includeGroup 'de.oceanlabs.mcp'
            includeModule 'net.minecraftforge', 'forge'
            includeModule 'net.minecraftforge', 'installertools'
        }
    }
}

// SRG -> MCP name tables. Legacy mod jars are reobfuscated to SRG names (func_1234_a / field_1234_a);
// the shim API is written with readable MCP names, so the transformer renames members on the fly.
def extractMappings = tasks.register('extractMappings', Sync) {
    into layout.buildDirectory.dir('generated/mappings')
    [('1.7.10'): configurations.mcp1710, ('1.12.2'): configurations.mcp1122].each { ver, conf ->
        from({ zipTree(conf.singleFile) }) {
            include 'methods.csv', 'fields.csv'
            into "legacyconnector/mappings/${ver}"
            // For 1.7.10 the MCP export is only the fallback table.
            if (ver == '1.7.10') rename { "fallback-${it}" }
        }
    }
    from({ zipTree(configurations.forge1710.singleFile) }) {
        include 'conf/methods.csv', 'conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.7.10/${it.name}" }
        includeEmptyDirs = false
    }
}
sourceSets.main.resources.srcDir extractMappings

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.loader',
                'Implementation-Version': project.version
        )
    }
}

// Content hash of the compiled translator, embedded as a resource. Part of every translation cache key, so changing
// the loader re-translates legacy jars without manual version bumps.
def buildIdDir = layout.buildDirectory.dir('generated/buildId')
def generateBuildId = tasks.register('generateBuildId') {
    def classesDir = sourceSets.main.java.classesDirectory
    def hierarchy = fileTree('src/main/resources/legacyconnector/legacy')
    def mappings = fileTree(layout.buildDirectory.dir('generated/mappings'))
    dependsOn 'extractMappings'
    inputs.files(classesDir, hierarchy, mappings)
    outputs.dir buildIdDir
    doLast {
        def md = java.security.MessageDigest.getInstance('SHA-256')
        (classesDir.get().asFileTree.files + hierarchy.files + mappings.files).sort { it.absolutePath }.each { md.update(it.bytes) }
        def out = buildIdDir.get().file('legacyconnector/loader-build-id.txt').asFile
        out.parentFile.mkdirs()
        out.text = md.digest().encodeHex().toString()
    }
}
sourceSets.main.resources.srcDir(files(buildIdDir).builtBy(generateBuildId))

// Legacy-named LaunchWrapper / FML relauncher API that 1.7.10 coremod plugins and class transformers link against.
// Packed as a nested jar: it is only ever loaded in the isolated class loader that runs legacy coremods.
sourceSets {
    coremodApi
}
dependencies {
    coremodApiCompileOnly "org.ow2.asm:asm-commons:${asm_version}"
    coremodApiCompileOnly "org.apache.logging.log4j:log4j-api:2.22.1"
}
def coremodApiJar = tasks.register('coremodApiJar', Jar) {
    from sourceSets.coremodApi.output
    archiveFileName = 'coremod-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/coremodApi/legacyconnector/legacy/1.7.10')
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/coremodApi')).builtBy(coremodApiJar))


// Offline inspection aid for the first Forge 1.20.1 content-mod pilot.
// Example: ./gradlew :loader:inspectForge1201 -Pforge1201Jar=/path/to/mod.jar
tasks.register('inspectForge1201', JavaExec) {
    group = 'verification'
    description = 'Inventories Forge API references and optionally prints selected mod method bytecode without loading it.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201ApiUsageAnalyzer'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        def traceMethods = project.findProperty('forge1201TraceMethods')
        def taskArgs = [jarPath.toString()]
        if (traceMethods != null && !traceMethods.toString().isBlank()) {
            taskArgs.add(traceMethods.toString())
        }
        setArgs(taskArgs)
    }
}

 
// Full preliminary Forge 1.20.1 preparation: metadata conversion followed by safe ASM package relocation.
// This deliberately does not enable mod discovery or claim that semantic API adapters are complete.
tasks.register('transformForge1201', JavaExec) {
    group = 'verification'
    description = 'Creates a preliminary NeoForge 1.21.1 Forge 1.20.1 JAR with reviewed package relocations and an optional external call-site adapter profile.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201JarTransformer'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        def outputPath = project.findProperty('forge1201Output')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        if (outputPath == null || outputPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Output=<path-to-new-transformed-jar>')
        }

        def loaderRange = project.findProperty('forge1201LoaderRange') ?: project.property('loader_version_range')
        def neoRange = project.findProperty('forge1201NeoForgeRange') ?: "[${project.property('neo_version')},)"
        def minecraftRange = project.findProperty('forge1201MinecraftRange') ?: project.property('minecraft_version_range')
        def taskArgs = [
                jarPath.toString(),
                outputPath.toString(),
                loaderRange.toString(),
                neoRange.toString(),
                minecraftRange.toString()
        ]
        def adapterProfile = project.findProperty('forge1201AdapterProfile')
        if (adapterProfile != null && !adapterProfile.toString().isBlank()) {
            taskArgs.add(adapterProfile.toString())
        }
        setArgs(taskArgs)
    }
}

// Produces a separate metadata-only NeoForge JAR for inspection.
// This does not remap classes and must not be added to the mod discovery pipeline.
tasks.register('transformForge1201Metadata', JavaExec) {
    group = 'verification'
    description = 'Creates a metadata-only NeoForge copy of a Forge 1.20.1 JAR without modifying the source.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201JarArchiveTransformer'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        def outputPath = project.findProperty('forge1201Output')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        if (outputPath == null || outputPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Output=<path-to-new-metadata-only-jar>')
        }

        def loaderRange = project.findProperty('forge1201LoaderRange') ?: project.property('loader_version_range')
        def neoRange = project.findProperty('forge1201NeoForgeRange') ?: "[${project.property('neo_version')},)"
        def minecraftRange = project.findProperty('forge1201MinecraftRange') ?: project.property('minecraft_version_range')
        setArgs([
                jarPath.toString(),
                outputPath.toString(),
                loaderRange.toString(),
                neoRange.toString(),
                minecraftRange.toString()
        ])
    }
}

// Read-only API mapping audit for the Forge 1.20.1 compatibility pilot.
// This reports package relocation candidates and semantic adapters; it does not rewrite the JAR.
tasks.register('auditForge1201Mappings', JavaExec) {
    group = 'verification'
    description = 'Audits Forge 1.20.1 API references against the reviewed NeoForge 1.21.1 mapping catalog.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.Forge1201MappingAudit'

    doFirst {
        def jarPath = project.findProperty('forge1201Jar')
        if (jarPath == null || jarPath.toString().isBlank()) {
            throw new GradleException('Supply -Pforge1201Jar=<path-to-forge-1.20.1-jar>')
        }
        setArgs([jarPath.toString()])
    }
}



// Generate source SRG -> Mojang-name CSVs only for the read-only member audit.
// MCPConfig's published 1.20.1 artifact is the configuration ZIP; its joined.tsrg is combined with
// Mojang's pinned 1.20.1 client/server mappings by the same Installertools task MCPConfig uses.
def forge1201SrgMappingDir = layout.buildDirectory.dir('generated/forge1201/srg-mappings')
def forge1201SrgMappingInputsDir = layout.buildDirectory.dir('generated/forge1201/srg-mapping-inputs')
def forge1201SrgMappingsJar = layout.buildDirectory.file('generated/forge1201/mappings/mappings.jar')

tasks.register('extractForge1201SrgMappings', JavaExec) {
    group = 'verification'
    description = 'Generates Forge 1.20.1 SRG-to-Mojang member CSVs for the read-only translated-JAR audit.'
    classpath = configurations.forge1201Installertools
    mainClass = 'net.minecraftforge.installertools.ConsoleTool'
    inputs.files(configurations.forge1201McpConfig, configurations.forge1201Installertools)
    inputs.property('minecraftVersion', '1.20.1')
    inputs.property('mcpConfigVersion', '1.20.1-20230612.114412')
    outputs.dir forge1201SrgMappingDir

    doFirst {
        def inputDir = forge1201SrgMappingInputsDir.get().asFile
        inputDir.mkdirs()
        def joinedTsrg = new File(inputDir, 'joined.tsrg')
        project.copy {
            from zipTree(configurations.forge1201McpConfig.singleFile)
            include 'config/joined.tsrg'
            eachFile { details -> details.path = 'joined.tsrg' }
            includeEmptyDirs = false
            into inputDir
        }
        if (!joinedTsrg.isFile() || joinedTsrg.length() == 0) {
            throw new GradleException('The pinned MCPConfig archive did not contain config/joined.tsrg')
        }

        // Resolve the official mappings for this exact Minecraft version from Mojang's version manifest.
        def fetchBytes = { String uri ->
            def connection = new URL(uri).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 60000
            connection.instanceFollowRedirects = true
            connection.inputStream.withCloseable { stream -> stream.bytes }
        }
        def manifestBytes = fetchBytes('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
        def manifest = new groovy.json.JsonSlurper().parseText(new String(manifestBytes, 'UTF-8'))
        def versionEntry = manifest.versions.find { it.id == '1.20.1' }
        if (versionEntry == null) {
            throw new GradleException('Mojang version manifest does not contain Minecraft 1.20.1')
        }
        def versionBytes = fetchBytes(versionEntry.url.toString())
        def versionInfo = new groovy.json.JsonSlurper().parseText(new String(versionBytes, 'UTF-8'))
        def downloads = versionInfo.downloads
        def digest = java.security.MessageDigest.getInstance('SHA-1')

        def downloadVerified = { String side ->
            def mappingInfo = downloads[side + '_mappings']
            if (mappingInfo == null || !mappingInfo.url || !mappingInfo.sha1) {
                throw new GradleException('Mojang version metadata is missing ' + side + ' mappings')
            }
            byte[] bytes = fetchBytes(mappingInfo.url.toString())
            String actualSha1 = digest.digest(bytes).encodeHex().toString()
            digest.reset()
            if (!actualSha1.equalsIgnoreCase(mappingInfo.sha1.toString())) {
                throw new GradleException(side + ' mappings SHA-1 mismatch: expected '
                        + mappingInfo.sha1 + ', received ' + actualSha1)
            }
            if (mappingInfo.size != null && bytes.length != mappingInfo.size.toString().toInteger()) {
                throw new GradleException(side + ' mappings size mismatch: expected '
                        + mappingInfo.size + ', received ' + bytes.length)
            }
            def destination = new File(inputDir, side + '-mappings.txt')
            destination.bytes = bytes
            destination
        }

        def clientMappings = downloadVerified('client')
        def serverMappings = downloadVerified('server')
        def mappingsJar = forge1201SrgMappingsJar.get().asFile
        mappingsJar.parentFile.mkdirs()
        setArgs([
                '--task', 'MAPPINGS_CSV',
                '--srg', joinedTsrg.absolutePath,
                '--client', clientMappings.absolutePath,
                '--server', serverMappings.absolutePath,
                '--output', mappingsJar.absolutePath
        ])
    }

    doLast {
        def outputDir = forge1201SrgMappingDir.get().asFile
        outputDir.mkdirs()
        project.copy {
            from zipTree(forge1201SrgMappingsJar.get().asFile)
            include 'methods.csv'
            include 'fields.csv'
            into outputDir
        }
        ['methods.csv', 'fields.csv'].each { name ->
            def mappingFile = new File(outputDir, name)
            if (!mappingFile.isFile() || mappingFile.length() == 0) {
                throw new GradleException('Installertools did not generate ' + name)
            }
        }
    }
}
