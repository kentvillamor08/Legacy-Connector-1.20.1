# Standalone build settings for the Forge 1.20.1 loader module.
# Run from the repository root: ./gradlew -p loader clean build

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

mod_group_id=org.kylepitcock.legacyconnector
